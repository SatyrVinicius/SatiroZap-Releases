name: Publish Windows update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag $tagVersion must match package version $packageVersion."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and publish installer/update files
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GH_TOKEN }}
